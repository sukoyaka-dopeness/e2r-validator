name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: e2r-validator
      - uses: actions/checkout@v6
        with:
          repository: sukoyaka-dopeness/e2r-spec
          path: e2r-spec
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
        working-directory: e2r-validator
      - name: Validate package
        run: npm run validate
        working-directory: e2r-validator
      - name: Verify release version
        run: |
          node -e "const tag = process.env.GITHUB_REF_NAME; const version = require('./package.json').version; if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Release tag must use the stable SemVer form vMAJOR.MINOR.PATCH.'); if (tag.slice(1) !== version) throw new Error('Release tag ' + tag + ' does not match package version ' + version + '.');"
        working-directory: e2r-validator
      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: e2r-validator
      - name: Publish package
        run: npm publish --access public
        working-directory: e2r-validator
